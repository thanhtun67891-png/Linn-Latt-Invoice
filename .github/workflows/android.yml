name: Build Linn Latt Invoice APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Project
        run: |
          unzip -q LinnLattInvoice-AndroidStudio-Project.zip -d source

      - name: Build APK
        working-directory: source/LinnLattInvoice
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: LinnLattInvoice-APK
          path: source/LinnLattInvoice/app/build/outputs/apk/debug/app-debug.apk
